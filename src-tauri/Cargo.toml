[package]
name = "rhine-music"
version = "0.3.0"
description = "Rhine Music desktop player"
edition = "2021"
license = "MIT"
default-run = "rhine-music"

[lib]
name = "rhine_music"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", features = [] }
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
lofty = "0.25"
id3 = "1"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
unicode-normalization = "0.1"
ferrous-opencc = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "native-tls", "system-proxy"] }
url = "2"
percent-encoding = "2"
dunce = "1"
rfd = "0.17"
webbrowser = "1"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "=0.22.1"
windows-future = "=0.3.2"
windows = { version = "=0.62.2", features = [
  "Foundation", "ApplicationModel", "Media_Control", "Media_Playback", "Media_Core",
  "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT",
  "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
  "Win32_System_Threading", "Win32_System_Registry", "Win32_System_RemoteDesktop",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
