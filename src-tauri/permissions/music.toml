[[permission]]
identifier = "allow-choose-music-folders"
description = "Select the main music folder through the system dialog. No arbitrary file writes."
commands.allow = ["choose_music_folders"]

[[permission]]
identifier = "allow-save-preferences"
description = "Save only the player's preference object to its application data directory."
commands.allow = ["save_preferences"]

[[permission]]
identifier = "allow-media-connection"
description = "Read Windows media sources and control only an explicitly selected source."
commands.allow = ["media_snapshot", "media_control"]

[[permission]]
identifier = "allow-netease-queue"
description = "After the user switches the queue on: read NetEase Cloud Music's saved play queue (display fields). After the user also switches playlist columns on: the id and name of the queue's source playlist and, read-only from its local database, the playlists the user created with their saved song lists (display fields only)."
commands.allow = ["netease_queue", "netease_playlists"]

[[permission]]
identifier = "allow-netease-debug"
description = "Control NetEase Cloud Music through its local DevTools port (127.0.0.1:9233) while its queue is shown: play a song of its queue, play one of the user's playlists from one of its songs (its queue becomes that playlist), seek in the current song, read the lyrics it has loaded for the song it plays (asking it to load them as its playing page does), and restart it with the port after the user's confirmed click."
commands.allow = ["netease_debug_state", "netease_debug_play", "netease_debug_play_playlist", "netease_debug_seek", "netease_debug_lyrics", "netease_debug_restart"]
