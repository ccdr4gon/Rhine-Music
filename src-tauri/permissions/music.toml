[[permission]]
identifier = "allow-choose-music-folders"
description = "Select music folders through the system dialog. No arbitrary file writes."
commands.allow = ["choose_music_folders"]

[[permission]]
identifier = "allow-save-preferences"
description = "Save only the player's preference object to its application data directory."
commands.allow = ["save_preferences"]

[[permission]]
identifier = "allow-media-connection"
description = "Read Windows media sources and control only an explicitly selected source."
commands.allow = ["media_snapshot", "media_control"]

[[permission]]
identifier = "allow-netease-queue"
description = "Read NetEase Cloud Music's saved play queue (display fields only) after the user switches it on."
commands.allow = ["netease_queue"]

[[permission]]
identifier = "allow-netease-debug"
description = "Control NetEase Cloud Music through its local DevTools port (127.0.0.1:9233) while its queue is shown and song switching is not turned off."
commands.allow = ["netease_debug_state", "netease_debug_play", "netease_debug_seek", "netease_debug_restart"]
